<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReefBeat Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="auth-gate" class="auth-gate hidden">
    <form id="auth-form" class="auth-card">
      <div class="auth-title">Dashboard locked</div>
      <p class="auth-copy">Enter the shared secret to control these devices.</p>
      <input id="auth-secret" type="password" autocomplete="current-password" placeholder="Shared secret">
      <button class="btn btn-primary" type="submit">Unlock</button>
      <div id="auth-error" class="inline-error"></div>
    </form>
  </div>
  <header class="topbar">
    <div class="topbar-logo">🐠 REEFBEAT</div>
    <div class="topbar-right">
      <div id="status-bar" class="status-bar"></div>
      <span id="last-refresh" class="last-refresh">—</span>
    </div>
  </header>
  <div class="app">
    <nav class="sidebar">
      <div class="sidebar-label">DEVICES</div>
      <div id="device-list"></div>
    </nav>
    <main id="detail-pane" class="detail-pane">
      <div class="loading-hint">Select a device from the sidebar</div>
    </main>
  </div>
  <script src="format.js"></script>
  <script src="app.js"></script>
</body>
</html>
